<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · ColdMailer</title>
    <style>
      :root { --bg: #f5f6f8; --fg: #12141a; --muted: #646b78; --primary: #2563eb; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d0f14; --fg: #e8eaee; --muted: #9aa1ad; --primary: #60a5fa; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; text-align: center; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button { background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="64" height="64" alt="" />
      <h1>You're offline</h1>
      <p>ColdMailer needs a connection to load your campaigns and replies.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
